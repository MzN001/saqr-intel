<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420" role="img" aria-label="Saqr, Abu Dhabi Anti-Scam Shield. Check any link, message, email, number or Maps listing before you trust it.">
  <title>Saqr, Abu Dhabi Anti-Scam Shield</title>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#111315" fill-opacity="0.08"/>
    </pattern>
    <clipPath id="frame"><rect width="1600" height="420" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1600" height="420" fill="#F7F5F0"/>
    <rect width="1600" height="420" fill="url(#dots)"/>
    <circle cx="1430" cy="40" r="300" fill="#057857" fill-opacity="0.09"/>
    <circle cx="80" cy="400" r="260" fill="#C9A978" fill-opacity="0.16"/>
    <rect x="0" y="0" width="1600" height="420" fill="none" stroke="#111315" stroke-opacity="0.08" stroke-width="2" rx="28"/>

    <!-- Saqr falcon mark (frontend/src/brand/saqr-falcon.svg) -->
    <g transform="translate(118 64) scale(0.57)" fill="#111315">
      <path fill-rule="evenodd" d="M260 24L354 51L371 78L394 97C403 110 405 128 400 146L390 172L380 145L354 146L344 182L352 203L424 284L368 379L274 219L341 136L296 140L219 252L135 317L159 369L168 306L248 244L163 402L89 284L145 218L179 81ZM262 38L344 60L354 75L334 86L271 63L208 77ZM195 94L268 77L268 91L286 111L309 106L316 92L330 98L326 106L286 132L253 180ZM187 104L217 151L160 219ZM243 191L208 244L140 297L155 236ZM334 164L331 185L377 303L287 223ZM358 86L382 103L368 129L349 124L315 127L338 111L344 96ZM352 100L366 101L352 112Z"/>
      <path d="M259 250L294 427L254 489L253 303L227 453L188 382Z"/>
      <path d="M270 237L344 362L311 444Z"/>
    </g>

    <text x="440" y="214" font-family="Gloock, 'DM Serif Display', Georgia, 'Times New Roman', serif" font-size="150" font-weight="700" fill="#111315" letter-spacing="-2">Saqr</text>
    <text x="808" y="214" font-family="'IBM Plex Sans Arabic', 'Noto Naskh Arabic', 'Segoe UI', Tahoma, sans-serif" font-size="64" fill="#111315" fill-opacity="0.45">صقر</text>
    <text x="446" y="266" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#057857" letter-spacing="5">ABU DHABI ANTI-SCAM SHIELD</text>
    <text x="446" y="322" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#111315" fill-opacity="0.78">Check any link, message, email, number or Maps listing before you trust it.</text>

    <!-- verdict scale -->
    <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700">
      <rect x="446" y="352" width="96" height="34" rx="17" fill="#10B981" fill-opacity="0.14"/>
      <circle cx="466" cy="369" r="6" fill="#10B981"/>
      <text x="480" y="375" fill="#065F46">Safe</text>
      <rect x="554" y="352" width="150" height="34" rx="17" fill="#F59E0B" fill-opacity="0.16"/>
      <circle cx="574" cy="369" r="6" fill="#F59E0B"/>
      <text x="588" y="375" fill="#92400E">Suspicious</text>
      <rect x="716" y="352" width="100" height="34" rx="17" fill="#DC2626" fill-opacity="0.12"/>
      <circle cx="736" cy="369" r="6" fill="#DC2626"/>
      <text x="750" y="375" fill="#991B1B">Scam</text>
    </g>
  </g>
</svg>
