<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saqr Demo Console</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#2a313c;--text:#e6edf3;--muted:#8b949e;--red:#f85149;--amber:#d29922;--green:#3fb950;--blue:#58a6ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,Segoe UI,Tahoma,sans-serif}
  header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{margin:0;font-size:20px}
  header .sub{color:var(--muted);font-size:13px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px}
  .dot.on{background:var(--green)}
  main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;padding:16px 20px}
  @media (max-width:900px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
  h2{margin:0 0 10px;font-size:15px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  input,button{font:inherit}
  input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#0b0f14;color:var(--text)}
  .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  button{padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:#21262d;color:var(--text);cursor:pointer}
  button.primary{background:#1f6feb;border-color:#1f6feb}
  button:disabled{opacity:.5;cursor:wait}
  .chip{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);cursor:pointer;background:none}
  .verdict{display:flex;align-items:center;gap:14px;margin:6px 0 12px}
  .score{font-size:34px;font-weight:700}
  .badge{padding:4px 10px;border-radius:6px;font-weight:700;font-size:14px}
  .HIGH-RISK{background:#3d1214;color:var(--red)} .SUSPICIOUS{background:#3a2c0b;color:var(--amber)} .SAFE{background:#0f2e17;color:var(--green)}
  .explain{white-space:pre-wrap;background:#0b0f14;border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0}
  .ar{direction:rtl;text-align:right;font-family:Tahoma,"Segoe UI",sans-serif}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:700px){.grid2{grid-template-columns:1fr}}
  img.shot{max-width:100%;border-radius:8px;border:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-word}
  td:first-child{color:var(--muted);width:38%}
  ul.flags{margin:0;padding-left:18px} ul.flags li{margin:3px 0}
  .sev{font-size:11px;font-weight:700;margin-right:6px}
  .sev.critical{color:var(--red)} .sev.high{color:#ff7b72} .sev.medium{color:var(--amber)} .sev.low{color:var(--muted)}
  #feed{list-style:none;margin:0;padding:0;max-height:460px;overflow:auto;font-size:13px}
  #feed li{padding:7px 4px;border-bottom:1px solid var(--line)}
  #feed .ev{color:var(--blue);font-weight:600}
  .muted{color:var(--muted)}
  .syn{border-left:3px solid var(--red);padding:6px 10px;margin:8px 0;background:#0b0f14;border-radius:4px;font-size:13px}
  .err{color:var(--red)}
</style>
</head>
<body>
<header>
  <h1>Saqr</h1>
  <span class="sub">Demo console · Abu Dhabi anti-fraud intelligence</span>
  <span class="sub" style="margin-left:auto"><span id="wsdot" class="dot"></span><span id="wsstate">Live feed connecting…</span></span>
</header>
<main>
  <section>
    <div class="card">
      <h2>Check a suspicious link</h2>
      <input id="url" placeholder="Paste a link or SMS text, e.g. tamm-smart-pay.net">
      <div class="row">
        <button class="primary" id="go">Analyze link</button>
        <span class="muted" style="align-self:center;font-size:13px">Try:</span>
        <button class="chip" data-u="adpolice-fines-ae.info">adpolice-fines-ae.info</button>
        <button class="chip" data-u="tamm-smart-pay.net">tamm-smart-pay.net</button>
        <button class="chip" data-u="adcb-card-verify.xyz">adcb-card-verify.xyz</button>
        <button class="chip" data-u="https://www.tamm.abudhabi">tamm.abudhabi (real)</button>
      </div>
      <div class="row">
        <button id="maps">Scan fake Maps pin</button>
        <button id="takedown" disabled>Generate takedown dossier</button>
        <button id="alert">Draft public warning</button>
      </div>
    </div>
    <div class="card" id="result" style="margin-top:16px;display:none"></div>
  </section>
  <aside>
    <div class="card">
      <h2>Criminal syndicates</h2>
      <div id="syns" class="muted">Loading…</div>
    </div>
    <div class="card" style="margin-top:16px">
      <h2>Police command center · live</h2>
      <ul id="feed"></ul>
    </div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
let lastScanId = null;

async function api(path, opts = {}) {
  const r = await fetch(path, {headers: {"content-type": "application/json"}, ...opts});
  const ct = r.headers.get("content-type") || "";
  const body = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(body.detail || body || r.statusText);
  return body;
}

function badge(v) { return `<span class="badge ${v.split(" ")[0]}">${esc(v)}</span>`; }

function flagsList(flags) {
  return `<ul class="flags">${(flags || []).filter(f => f.points > 0).map(f =>
    `<li><span class="sev ${f.severity}">${f.severity.toUpperCase()}</span>${esc(f.en)}</li>`).join("") || "<li class='muted'>None</li>"}</ul>`;
}

function showUrl(r) {
  const ti = r.technical_indicators || {};
  lastScanId = r.verdict !== "SAFE" ? r.scan_id : null;
  $("takedown").disabled = !lastScanId;
  const rows = [
    ["Domain", r.domain], ["Impersonates", r.impersonated_entity || "—"],
    ["IP address", (ti.ip_addresses || []).join(", ") || "—"], ["ASN", [ti.asn, ti.asn_org].filter(Boolean).join(" · ") || "—"],
    ["SSL issuer", ti.ssl_issuer || "—"], ["Registered", ti.domain_age_hours != null ? `${ti.domain_age_hours} hours ago` : "—"],
    ["Steals", (ti.harvested_fields || []).join(", ") || "—"],
    ["Hides from scanners", ti.cloaking ? (ti.cloaking.detected ? "YES (cloaking)" : "no") : "—"],
    ["Analysed by", r.analyzer?.engine], ["Scan ID", r.scan_id],
  ];
  $("result").style.display = "block";
  $("result").innerHTML = `
    <h2>Result</h2>
    <div class="verdict"><span class="score">${r.risk_score}/100</span>${badge(r.verdict)}</div>
    ${r.syndicate ? `<div class="syn">🕸️ Linked to <b>${esc(r.syndicate.name)}</b> — ${r.syndicate.domains.length} domains on ${esc(r.syndicate.ip_addresses.join(", "))}</div>` : ""}
    <div class="grid2">
      <div class="explain">${esc(r.citizen_explanation_en)}</div>
      <div class="explain ar" dir="rtl">${esc(r.citizen_explanation_ar)}</div>
    </div>
    <div class="grid2">
      <div>${r.screenshot_base64 ? `<img class="shot" alt="Sandbox screenshot of the scanned page" src="data:image/jpeg;base64,${r.screenshot_base64}">` : `<p class="muted">No screenshot (official site or unreachable).</p>`}</div>
      <div><table>${rows.map(([k, v]) => `<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join("")}</table>
        <h2 style="margin-top:14px">Red flags</h2>${flagsList(r.red_flags)}</div>
    </div>`;
}

function showMaps(r) {
  const l = r.listing;
  lastScanId = r.verdict !== "SAFE" ? r.scan_id : null;
  $("takedown").disabled = !lastScanId;
  $("result").style.display = "block";
  $("result").innerHTML = `
    <h2>Google Maps listing</h2>
    <div class="verdict"><span class="score">${r.risk_score}/100</span>${badge(r.verdict)}</div>
    <table>
      <tr><td>Listing</td><td>${esc(l.name)}</td></tr>
      <tr><td>Location</td><td>${esc(l.address || "")} (${l.lat}, ${l.lng})</td></tr>
      <tr><td>Website</td><td>${esc(l.website_domain || "—")}</td></tr>
      <tr><td>Phone</td><td>${esc(l.phone || "—")}</td></tr>
      <tr><td>Pretends to be</td><td>${esc(r.impersonated_entity || "—")}</td></tr>
    </table>
    ${r.syndicate ? `<div class="syn">🕸️ Linked to <b>${esc(r.syndicate.name)}</b></div>` : ""}
    <div class="grid2"><div class="explain">${esc(r.citizen_explanation_en)}</div><div class="explain ar" dir="rtl">${esc(r.citizen_explanation_ar)}</div></div>`;
}

async function run(btn, fn) {
  btn.disabled = true; const old = btn.textContent; btn.textContent = "Working…";
  try { await fn(); } catch (e) {
    $("result").style.display = "block"; $("result").innerHTML = `<p class="err">Error: ${esc(e.message)}</p>`;
  } finally { btn.disabled = false; btn.textContent = old; loadSyndicates(); }
}

$("go").onclick = () => run($("go"), async () => {
  const v = $("url").value.trim(); if (!v) return;
  const looksLikeText = /\s/.test(v);
  showUrl(await api("/api/analyze-url", {method: "POST", body: JSON.stringify(looksLikeText ? {message_text: v, channel: "sms"} : {url: v, channel: "web"})}));
});
$("url").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });
document.querySelectorAll(".chip").forEach(c => c.onclick = () => { $("url").value = c.dataset.u; $("go").click(); });

$("maps").onclick = () => run($("maps"), async () => showMaps(await api("/api/scan-maps", {method: "POST", body: JSON.stringify(
  {maps_url: "https://www.google.com/maps/place/Abu+Dhabi+Police+Traffic+Fines+Payment+Center/@24.3489,54.5052,17z"})})));

$("takedown").onclick = () => run($("takedown"), async () => {
  const md = await api(`/api/generate-takedown/${lastScanId}?format=markdown`, {method: "POST"});
  $("result").innerHTML = `<h2>Takedown dossier</h2><div class="explain" style="font-family:ui-monospace,Consolas,monospace;font-size:12.5px">${esc(md)}</div>`;
});

$("alert").onclick = () => run($("alert"), async () => {
  const a = await api("/api/awareness-alert");
  $("result").style.display = "block";
  $("result").innerHTML = a.status !== "active_wave" ? `<p class="muted">No active scam wave right now.</p>` : `
    <h2>Public warning draft · ${esc(a.severity)} · ${esc(a.trending_entity)}</h2>
    <div class="grid2"><div class="explain"><b>${esc(a.title_en)}</b>\n\n${esc(a.post_en)}</div>
    <div class="explain ar" dir="rtl"><b>${esc(a.title_ar)}</b>\n\n${esc(a.post_ar)}</div></div>
    <h2>Short post for X</h2><div class="explain">${esc(a.x_post_en)}</div><div class="explain ar" dir="rtl">${esc(a.x_post_ar)}</div>`;
});

async function loadSyndicates() {
  try {
    const g = await api("/api/syndicate-graph");
    $("syns").innerHTML = `<p class="muted" style="margin-top:0">${g.stats.nodes} nodes · ${g.stats.edges} links</p>` +
      g.syndicates.map(s => `<div class="syn"><b>${esc(s.name)}</b> <span class="muted">${esc(s.name_ar || "")}</span><br>
        ${s.domains.length} fake sites · ${s.map_pins.length} map pins · ${s.citizen_reports} reports<br>
        <span class="muted">${esc(s.domains.join(", "))}</span></div>`).join("");
  } catch (e) { $("syns").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}

const LABELS = {"citizen_report.received": "📩 Citizen report", "url_scan.completed": "🔎 Link verdict", "maps_scan.completed": "📍 Maps verdict",
  "graph.updated": "🕸️ Graph updated", "ct.detection": "🛰️ New fake site certificate", "takedown.generated": "📄 Takedown dossier", "awareness.drafted": "📢 Warning drafted"};
function feed(msg) {
  if (!LABELS[msg.event]) return;
  const d = msg.data, li = document.createElement("li");
  const detail = d.verdict ? `${d.domain || d.listing?.name || ""} → ${d.verdict} (${d.risk_score})`
    : d.domain ? `${d.domain} (score ${d.score}, ${d.impersonated_entity})`
    : d.target || d.case_reference || d.title_en || d.scan_id || "";
  li.innerHTML = `<span class="ev">${LABELS[msg.event]}</span> <span class="muted">${new Date(msg.ts).toLocaleTimeString()}</span><br>${esc(detail)}`;
  $("feed").prepend(li);
  while ($("feed").children.length > 60) $("feed").lastChild.remove();
}
function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/live`);
  ws.onopen = () => { $("wsdot").classList.add("on"); $("wsstate").textContent = "Live feed connected"; };
  ws.onmessage = (e) => { const m = JSON.parse(e.data); if (m.event === "hello") (m.data.recent || []).forEach(feed); else feed(m); };
  ws.onclose = () => { $("wsdot").classList.remove("on"); $("wsstate").textContent = "Live feed reconnecting…"; setTimeout(connect, 2000); };
}
connect(); loadSyndicates();
</script>
</body>
</html>
