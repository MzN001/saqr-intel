# Render Blueprint - SAQR-INTEL FastAPI backend on the free tier (512 MB RAM, one Uvicorn worker).
# The backend is the repository root (main.py + saqr/); the Next.js site in frontend/ runs on Vercel.
# Render dashboard -> New -> Blueprint -> pick this repo. Fill in the "sync: false" secrets when asked.
services:
  - type: web
    name: saqr-intel-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      ignoredPaths:
        - frontend/**
        - extension/**
        - demo-scam-site/**
        - tests/**
        - '**/*.md'
        - '*.ps1'
        - '*.bat'
        - '*.sh'
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENABLE_PLAYWRIGHT          # no headless Chromium on 512 MB: pages are fetched with httpx
        value: "false"
      - key: CT_MODE                    # simulated certificate feed for the demo radar
        value: simulated
      - key: HUNTER_MODE                # proactive hunter: real look-alike / crt.sh / new-domain leads
        value: live
      - key: HUNTER_MAX_SCANS_PER_CYCLE # 512 MB, one worker: few full scans per 15-minute cycle
        value: "8"
      - key: HUNTER_SCAN_CONCURRENCY
        value: "1"
      - key: HUNTER_SWEEP_BATCH
        value: "400"
      - key: HUNTER_DNS_CONCURRENCY
        value: "15"
      - key: DATABASE_PATH              # free tier disk is wiped on every restart / deploy
        value: ./data/saqr_intel.db
      - key: CORS_ORIGINS
        value: https://saqr-intel.vercel.app,http://localhost:3000,http://127.0.0.1:3000
      - key: GEMINI_API_KEY             # optional; without it the rules engine is used
        sync: false
      - key: NEXTDNS_PROFILE_ID         # phone DNS shield feed (optional)
        sync: false
      - key: NEXTDNS_API_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY          # keep scam-alert push keys stable across restarts (PEM, \n escaped)
        sync: false
      - key: POLICE_API_KEY             # locks /police APIs + police WebSocket topics (unset = everything open)
        sync: false
      - key: CAMPAIGN_FEEDS             # live phishing-campaign feeds for email scanning (refreshed every 6 h)
        value: "true"
      - key: USER_LLM_ALLOW_PRIVATE     # a citizen's own AI must never be a private address on the cloud
        value: "false"

  # Phone-demo FAKE scam page (demo-scam-site/: training replica, inert form, noindex) on a neutral
  # address without "saqr" or "vercel" in it. Static sites are free and never sleep.
  - type: web
    name: uae-fines-refund-portal
    runtime: static
    staticPublishPath: ./demo-scam-site
    buildCommand: echo "static demo page"
    autoDeploy: true
    buildFilter:
      paths:
        - demo-scam-site/**
