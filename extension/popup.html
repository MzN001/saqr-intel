<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Saqr</title>
    <link rel="stylesheet" href="shield.css" />
    <style>
      body {
        width: 360px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 500;
        color: var(--ink-soft);
      }
      main {
        padding: 0 12px 12px;
        display: grid;
        gap: 12px;
      }
      .tab-card {
        padding: 18px;
      }
      .tab-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .tab-host {
        margin: 6px 0 0;
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--ink-soft);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        direction: ltr;
        unicode-bidi: isolate;
      }
      [dir="rtl"] .tab-host {
        text-align: right;
      }
      .tab-score {
        font-size: 13px;
        font-weight: 600;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .tab-title {
        margin: 12px 0 0;
        font-size: 17px;
        font-weight: 600;
        line-height: 1.35;
      }
      .tab-sub {
        margin: 2px 0 0;
        font-size: 13px;
        color: var(--ink-soft);
      }
      .tab-card .btn {
        margin-top: 16px;
      }
      .list {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-card);
        overflow: hidden;
      }
      .item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        min-height: 52px;
        padding: 10px 16px;
        border: 0;
        background: transparent;
        text-align: start;
        cursor: pointer;
      }
      .item + .item,
      .item + details,
      details + .item {
        border-top: 1px solid var(--line);
      }
      button.item:hover,
      details.item > summary:hover {
        background: var(--muted);
      }
      .item strong {
        display: block;
        font-size: 14px;
        font-weight: 600;
      }
      .item small {
        display: block;
        font-size: 12px;
        color: var(--ink-soft);
        line-height: 1.4;
      }
      .chev {
        color: var(--ink-soft);
        flex: none;
      }
      [dir="rtl"] .chev {
        transform: scaleX(-1);
      }
      details.conn {
        display: block;
        padding: 0;
      }
      details.conn > summary {
        list-style: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 52px;
        padding: 10px 16px;
        cursor: pointer;
      }
      details.conn > summary::-webkit-details-marker {
        display: none;
      }
      details.conn[open] .chev {
        transform: rotate(90deg);
      }
      .conn-body {
        padding: 0 16px 16px;
      }
      .demo {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }
      .demo .btn {
        width: 100%;
      }
      footer {
        padding: 0 16px 14px;
        font-size: 12px;
        color: var(--ink-soft);
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <header class="brand-bar">
      <!-- Saqr lockup: falcon (frontend/src/brand) + "Saqr" outlined from Gloock 400 (OFL). currentColor. -->

      <span class="status" aria-live="polite"><span class="dot" id="status-dot"></span><span id="status-short">Checking…</span></span>
    </header>

    <main>
      <section class="card tab-card" aria-labelledby="this-tab">
        <div class="tab-head">
          <p class="label" id="this-tab" data-i18n="thisTab">This tab</p>
          <span class="tab-score" id="tab-score"></span>
        </div>
        <p class="tab-host" id="tab-host"></p>
        <p class="tab-title" id="tab-title">Not scanned yet</p>
        <p class="tab-sub" id="tab-sub" data-i18n="autoOn">Every page you open is checked automatically.</p>
        <button class="btn btn-primary" id="scan-now" type="button" data-i18n="scanNow">Scan this tab</button>
        <div id="scan-msg" class="toast hidden" role="status" aria-live="polite"></div>
      </section>

      <div class="list">
        <button class="item" id="open-options" type="button">
          <span>
            <strong data-i18n="emailShield">Email Shield and settings</strong>
            <small id="email-state" data-i18n="emailState">Gmail and Outlook are checked when you open an email.</small>
          </span>
          <svg class="chev" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
        <details class="item conn" id="conn">
          <summary>
            <span>
              <strong data-i18n="connection">Connection and demo</strong>
              <small id="status-text">Checking…</small>
            </span>
            <svg class="chev" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </summary>
          <div class="conn-body">
            <form class="field" id="api-form">
              <label class="sr-only" for="api-url">Saqr server address</label>
              <input class="input" id="api-url" type="url" dir="ltr" spellcheck="false" autocomplete="off" placeholder="https://saqr-intel-api.onrender.com" />
              <button class="btn btn-secondary btn-sm" type="submit" data-i18n="save">Save</button>
            </form>
            <div id="api-msg" class="toast hidden" role="status" aria-live="polite"></div>
            <div class="demo">
              <button class="btn btn-secondary btn-sm" id="demo-tamm" type="button" data-i18n="demoTamm">Demo: fake TAMM fine</button>
              <button class="btn btn-secondary btn-sm" id="demo-post" type="button" data-i18n="demoPost">Demo: fake Emirates Post</button>
            </div>
          </div>
        </details>
      </div>
    </main>
    <footer><span data-i18n="report">Report fraud: Aman 8002626 · SMS 2828</span></footer>
    <script src="lib/config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
